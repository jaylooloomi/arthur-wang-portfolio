<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='1080' viewBox='0 0 1440 1080'><defs><marker id='arrow' markerWidth='9' markerHeight='9' refX='8' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8' fill='none' stroke='#444'/></marker></defs><style>text{font-family:Arial,Microsoft JhengHei,sans-serif}.edge{fill:none;stroke:#444;stroke-width:2;marker-end:url(#arrow)}</style><rect width='1440' height='1080' fill='white'/><text x='35' y='45' font-size='26'>02 — Wireflow / 原圖入口 → 延伸互動與狀態</text><rect x='40' y='100' width='350' height='170' rx='7' fill='#f5f5f3' stroke='#777'/><text x='56' y='128' font-size='17' font-weight='bold'>S0 首頁</text><text x='56' y='153' font-size='13' fill='#555'>品牌主張 / 主題展覽 / 12 件產品</text><rect x='530' y='100' width='360' height='170' rx='7' fill='#f5f5f3' stroke='#777'/><text x='546' y='128' font-size='17' font-weight='bold'>S1 產品列表 / 結果</text><text x='546' y='153' font-size='13' fill='#555'>搜尋 × 分類 × 排序；顯示結果數</text><rect x='1030' y='100' width='360' height='170' rx='7' fill='#f5f5f3' stroke='#777'/><text x='1046' y='128' font-size='17' font-weight='bold'>S2 產品詳情對話框</text><text x='1046' y='153' font-size='13' fill='#555'>原縮圖 / 名稱 / 介紹 / 標籤 / 關閉</text><rect x='530' y='370' width='360' height='150' rx='7' fill='#f5f5f3' stroke='#777'/><text x='546' y='398' font-size='17' font-weight='bold'>S1a 空結果</text><text x='546' y='423' font-size='13' fill='#555'>保留條件 / 清除搜尋與分類</text><rect x='40' y='650' width='350' height='190' rx='7' fill='#f5f5f3' stroke='#777'/><text x='56' y='678' font-size='17' font-weight='bold'>S3 主題展覽對話框</text><text x='56' y='703' font-size='13' fill='#555'>展覽原圖 / 說明 / 策展人 / 展出作品</text><rect x='530' y='650' width='360' height='190' rx='7' fill='#f5f5f3' stroke='#777'/><text x='546' y='678' font-size='17' font-weight='bold'>S4 關於對話框</text><text x='546' y='703' font-size='13' fill='#555'>品牌簡介 / 關閉回首頁</text><rect x='1030' y='650' width='360' height='190' rx='7' fill='#f5f5f3' stroke='#777'/><text x='1046' y='678' font-size='17' font-weight='bold'>S5 實際產品 Demo（未接線）</text><text x='1046' y='703' font-size='13' fill='#555'>預留 demoUrl；需真實產品資料後連接</text><path class='edge' d='M391 180 H530'/><text x='401' y='165' font-size='13'>探索 / 搜尋</text><path class='edge' d='M890 180 H1030'/><text x='902' y='165' font-size='13'>開啟產品</text><path class='edge' d='M710 270 V370'/><text x='724' y='325' font-size='13'>0 筆結果</text><path class='edge' d='M530 450 H470 V245 H530'/><text x='395' y='350' font-size='13'>清除條件</text><path class='edge' d='M215 270 V650'/><text x='230' y='570' font-size='13'>進入展覽 / 導覽主題展覽</text><path class='edge' d='M391 725 H440 V210 H530'/><text x='452' y='600' font-size='13'>瀏覽展出作品</text><path class='edge' d='M300 270 V580 H710 V650'/><text x='530' y='565' font-size='13'>關於</text><path class='edge' d='M1210 270 V650' stroke-dasharray='7 6'/><text x='1225' y='470' font-size='13'>未來接入網址</text><path class='edge' d='M1100 100 V75 H820 V100'/><text x='950' y='65' font-size='13'>關閉 / Esc：保留列表條件</text><text x='40' y='920' font-size='17'>實線：prototype 已提供的互動　／　虛線：未來接線</text><text x='40' y='960' font-size='15'>補充：關鍵字不分大小寫；查名稱、介紹、標籤。熱門排序沿用原圖順序，沒有真實熱門度資料。</text><text x='40' y='995' font-size='15'>S2、S3、S4 與空結果為依首頁合理延伸的流程；原圖只提供首頁。未額外虛構其他展覽。</text></svg>
